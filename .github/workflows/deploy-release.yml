name: Deploy Release

on:
  push:
    branches:
      - preview
      - main
  workflow_dispatch:

concurrency:
  group: anify-landing-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download splat assets for static hosting
        run: |
          mkdir -p public/gs
          curl -fL "https://oss.anify.ai/gs/elder-tree-hollow_500k.spz" -o public/gs/elder-tree-hollow_500k.spz
          curl -fL "https://oss.anify.ai/gs/elder-tree-hollow_100k.spz" -o public/gs/elder-tree-hollow_100k.spz

      - name: Build
        env:
          GITHUB_PAGES: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
